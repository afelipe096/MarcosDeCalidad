name: Escaneos de seguridad

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "devsecops/requirements.txt"
      - ".github/workflows/security.yml"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Analizar vulnerabilidades en el codigo
        run: bandit -r src -ll

      - name: Auditar dependencias
        run: pip-audit -r devsecops/requirements.txt

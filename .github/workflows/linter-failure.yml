name: Demostracion de bloqueo por linter

on:
  workflow_dispatch:
  push:
    paths:
      - "devsecops/linter_failure.py"
      - ".github/workflows/linter-failure.yml"

jobs:
  # La validación detecta los defectos controlados del archivo de prueba.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Flake8
        run: python -m pip install flake8

      - name: Ejecutar linter
        run: flake8 devsecops/linter_failure.py --select=E,W,F

  # El despliegue depende del resultado exitoso del job de validación.
  deploy:
    needs: lint
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue bloqueado si falla el linter
        run: echo "El linter aprobo. Se permitiria continuar con el despliegue."

name: Exportar diagramas C4 a PNG

on:
  workflow_dispatch:
  push:
    paths:
      - "arquitectura/*.puml"
      - ".github/workflows/diagrams.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Renderizar diagramas PlantUML
        run: |
          docker run --rm -v "$PWD:/workspace" plantuml/plantuml:latest -tpng /workspace/arquitectura/C1-contexto.puml /workspace/arquitectura/C2-contenedores.puml

      - name: Guardar PNG en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arquitectura/C1-contexto.png arquitectura/C2-contenedores.png
          if git diff --cached --quiet; then
            echo "Los diagramas PNG ya están actualizados."
          else
            git commit -m "Agregar diagramas C4 exportados en PNG"
            git push
          fi

      - name: Publicar PNG como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: diagramas-c4-png
          path: arquitectura/*.png
          if-no-files-found: error
